<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Bot Calculators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Ocultar flechas de incremento y decremento en los campos de número */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }

    input[type=number] {
      -moz-appearance: textfield; /* Para Firefox */
    }

    /* Estilo del slider */
    input[type=range] {
      width: 100%;
      height: 8px;
      background: #d3d3d3;
      outline: none;
      border-radius: 5px;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: #4CAF50;
      cursor: pointer;
      border-radius: 50%;
    }
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: #4CAF50;
      cursor: pointer;
      border-radius: 50%;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-blue-100 to-blue-300 min-h-screen flex items-center justify-center">
  <div class="absolute top-4 right-4">
    <button id="toggleTheme" class="bg-gradient-to-r from-gray-700 to-gray-800 text-white px-4 py-2 rounded-md hover:bg-gray-600">🌙</button>
  </div>

  <!-- Contenedor principal -->
  <div id="mainContainer" class="bg-gradient-to-r from-white to-gray-100 shadow-lg rounded-lg p-6 w-full max-w-6xl flex flex-col space-y-6 px-4 md:px-6">
    <!-- Título y descripción -->
    <div class="flex flex-col space-y-4 items-center">
      <div class="w-full flex flex-col space-y-4 items-center">
        <h1 id="title" class="text-2xl font-bold text-center mb-4">
          <div class='text-center text-6xl mb-4'>🤖</div>
          <h1 id="title" class="text-3xl font-bold text-center mb-4">Simulador de Estrategias para CriptoBots</h1>
        </h1>

        <p id="description" class="text-gray-600 text-sm mb-4">
          💡 Esta herramienta ofrece múltiples calculadoras para ayudarte en tus operaciones de trading en criptomonedas.
        </p>
      </div>

    <!-- Contenedor de las dos calculadoras -->
    <div class="flex w-full flex-wrap md:flex-nowrap justify-between items-stretch space-y-6 md:space-y-0 md:space-x-6">
      <!-- Contenedor de la primera calculadora -->
      <div class="w-full md:w-1/2 flex flex-col items-stretch space-y-6 h-full md:min-h-[400px]">
        <h2 class="text-xl font-semibold text-center mb0">
          🧮 Calculadora de Rango
        </h2>
        <!-- Formulario de la primera calculadora -->
        <form id="botForm" class="space-y-6 flex flex-col justify-between h-auto">
          <div>
            <label for="minPrice" class="block text-sm font-medium text-gray-400">
              📉 Precio Mínimo:
            </label>
            <input type="number" id="minPrice" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white text-black" inputmode="decimal" required>
          </div>

          <div>
            <label for="maxPrice" class="block text-sm font-medium text-gray-400">
              📈 Precio Máximo:
            </label>
            <input type="number" id="maxPrice" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white text-black" inputmode="decimal" required>
          </div>

          <div>
            <label for="gridCount" class="block text-sm font-medium text-gray-400">
              🔢 Número de Rejillas:
            </label>
            <input type="number" id="gridCount" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white text-black" inputmode="numeric" required>
          </div>

          <button type="button" id="calculateBtn" class="w-full bg-blue-600 text-white py-2 mt-12 rounded-md hover:bg-blue-700 focus:ring-4 focus:ring-blue-500 transform transition-transform duration-300 hover:scale-105">
            🚀 Calcular
          </button>
        </form>

        <!-- Resultados de la primera calculadora -->
        <div id="result" class="mt-4 hidden bg-blue-50 border border-blue-300 rounded-lg p-4 shadow-md min-h-[180px] flex items-center justify-center">
          <h3 class="text-lg font-bold text-blue-600 flex items-center"><span class="mr-2">📊</span>
            Resultados:
          </h3>
          <ul id="resultText" class="mt-2 text-gray-700 list-disc pl-5 space-y-2"></ul>
        </div>
      </div>

      <!-- Contenedor de la segunda calculadora -->
      <div class="w-full md:w-1/2 flex flex-col justify-between items-stretch space-y-6 h-full">
        <h2 class="text-xl font-semibold text-center mb0">
          ⚖️ Calculadora de Apalancamiento
        </h2>
        <!-- Formulario de la segunda calculadora -->
        <form id="leverageForm" class="space-y-6 flex flex-col justify-between h-full">
          <div>
            <label for="investment" class="block text-sm font-medium text-gray-400">
              💰 Inversión Inicial:
            </label>
            <input type="number" id="investment" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white text-black" inputmode="decimal" required>
          </div>

          <!-- Contenedor del apalancamiento con botones y slider -->
          <div class="flex flex-col justify-center items-center w-full md:w-[540px] h-[65.5px] px-4 py-2">
            <label for="leverage" class="block text-sm font-medium text-gray-400">💹 Apalancamiento (x1 - x100):</label>
            <input type="range" id="leverage" class="mt-1 block w-full" min="1" max="100" value="1">
            <div class="flex justify-center gap-4 mt-2">
              <button type="button" id="decreaseLeverage" class="bg-gradient-to-r from-gray-300 to-gray-400 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400 transform transition-transform duration-300 hover:scale-105">-</button>
              <span id="leverageValue" class="text-lg font-bold dark:text-white">x1</span>
              <button type="button" id="increaseLeverage" class="bg-gradient-to-r from-gray-300 to-gray-500 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-500 transform transition-transform duration-300 hover:scale-105">+</button>
            </div>
          </div>

          <div>
            <label for="percentage" class="block text-sm font-medium text-gray-400">
              📊 Porcentaje:
            </label>
            <input type="number" id="percentage" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white text-black" inputmode="decimal" min="0" max="100" required>
          </div>

          <button type="button" id="calculateLeverage" class="w-full bg-green-600 text-white py-2 mt-12 rounded-md hover:bg-green-700 focus:ring-4 focus:ring-green-500 transform transition-transform duration-300 hover:scale-105" disabled>
            🚀 Calcular
          </button>

        <!-- Resultados de la segunda calculadora -->
        <div id="leverageResult" class="mt-4 hidden bg-blue-50 border border-blue-300 rounded-lg p-4 shadow-md min-h-[180px] flex items-center justify-center">
          <h3 class="text-lg font-bold text-blue-600 flex items-center"><span class="mr-2">📊</span>
            Resultados:
          </h3>
          <ul id="leverageResultText" class="mt-2 text-gray-700 list-disc pl-5 space-y-2"></ul>
        </div>
      </div>
    </div>
           
          </div>
        </div>
  <script>
    const gridCountInput = document.getElementById('gridCount');
    const leverageSlider = document.getElementById('leverage');
    const leverageValue = document.getElementById('leverageValue');
    const leverageButton = document.getElementById('calculateLeverage');

    const formatNumber = (num, decimals = 2) => {
      if (Number.isInteger(num)) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      }
      return num.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    };

    leverageSlider.addEventListener('input', () => {
      leverageValue.textContent = `x${leverageSlider.value}`;
    });

    // Botones para aumentar y disminuir el slider
    document.getElementById('decreaseLeverage').addEventListener('click', () => {
      let currentValue = parseInt(leverageSlider.value, 10);
      if (currentValue > parseInt(leverageSlider.min, 10)) {
        currentValue--;
        leverageSlider.value = currentValue;
        leverageValue.textContent = `x${currentValue}`;
      }
    });

    document.getElementById('increaseLeverage').addEventListener('click', () => {
      let currentValue = parseInt(leverageSlider.value, 10);
      if (currentValue < parseInt(leverageSlider.max, 10)) {
        currentValue++;
        leverageSlider.value = currentValue;
        leverageValue.textContent = `x${currentValue}`;
      }
    });

    document.getElementById('calculateBtn').addEventListener('click', () => {
      const minPrice = parseFloat(document.getElementById('minPrice').value);
      const maxPrice = parseFloat(document.getElementById('maxPrice').value);
      const gridCount = parseInt(gridCountInput.value, 10);

      if (isNaN(minPrice) || isNaN(maxPrice) || isNaN(gridCount) || gridCount <= 0) {
        alert('Por favor, introduce valores válidos en todos los campos.');
        return;
      }

      gridCountInput.setAttribute('data-grid-count', gridCount);

      const priceRange = maxPrice - minPrice;
      const formattedPriceRange = formatNumber(priceRange, Number.isInteger(priceRange) ? 0 : 2);
      const movementPerGrid = priceRange / gridCount;
      const formattedMovementPerGrid = formatNumber(movementPerGrid, 3);

      document.getElementById('resultText').textContent = `Tu rango total de precios es de ${formattedPriceRange} dólares. Para capturar una ronda en el bot, el precio necesita moverse ${formattedMovementPerGrid} dólares por rejilla.`;
      document.getElementById('result').classList.remove('hidden');

      leverageButton.disabled = false;
    });

    leverageButton.addEventListener('click', () => {
      const investment = parseFloat(document.getElementById('investment').value);
      const leverage = parseFloat(leverageSlider.value);
      const percentage = parseFloat(document.getElementById('percentage').value);
      const gridCount = parseInt(gridCountInput.getAttribute('data-grid-count'), 10);

      if (
        isNaN(investment) ||
        isNaN(leverage) ||
        isNaN(percentage) ||
        leverage < 1 ||
        leverage > 100 ||
        percentage < 0 ||
        percentage > 100 ||
        isNaN(gridCount) ||
        gridCount <= 0
      ) {
        alert('Por favor, introduce valores válidos en todos los campos y calcula las rejillas primero en la primera calculadora.');
        return;
      }

      const totalInvestment = investment * leverage;
      const formattedTotalInvestment = formatNumber(totalInvestment, Number.isInteger(totalInvestment) ? 0 : 2);
      const investmentPerGrid = totalInvestment / gridCount;
      const percentageValue = (investmentPerGrid * percentage) / 100;

      document.getElementById('leverageResultText').textContent = `Inversión total con apalancamiento: ${formattedTotalInvestment} dólares. Por rejilla: ${formatNumber(investmentPerGrid)} dólares. El ${percentage}% de esta cantidad es: ${formatNumber(percentageValue, 3)} dólares.`;
      document.getElementById('leverageResult').classList.remove('hidden');
    });

    const toggleThemeButton = document.getElementById('toggleTheme');
      toggleThemeButton.textContent = document.body.classList.contains('bg-gradient-to-r from-gray-800 to-gray-900') ? '🌞' : '🌙';

      // Manejador del cambio de tema
    toggleThemeButton.addEventListener('click', () => {
      const body = document.body;
      const mainContainer = document.getElementById('mainContainer');
      const title = document.getElementById('title');
      const description = document.getElementById('description');
      const inputs = document.querySelectorAll('input');

      // Alternar colores del fondo para modo claro y oscuro
      body.classList.toggle('bg-gradient-to-r');
      body.classList.toggle('from-blue-100');
      body.classList.toggle('to-blue-300');
      body.classList.toggle('bg-gray-900');
      body.classList.toggle('bg-gradient-to-r');
      body.classList.toggle('from-black');
      body.classList.toggle('to-gray-900');
      
      
      body.classList.toggle('from-black');
      body.classList.toggle('to-gray-900');
      body.classList.toggle('from-black');
      body.classList.toggle('to-gray-900');
      body.classList.toggle('text-white');
      body.classList.toggle('from-black');
      body.classList.toggle('to-gray-900');

      // Alternar colores del contenedor principal para modo claro y oscuro
      mainContainer.classList.toggle('bg-gradient-to-r');
      mainContainer.classList.toggle('from-white');
      mainContainer.classList.toggle('to-gray-100');
      mainContainer.classList.toggle('bg-gray-700');

      title.classList.toggle('text-black');
      title.classList.toggle('text-white');

      description.classList.toggle('text-gray-400');
      description.classList.toggle('text-gray-600');

      // Alternar colores de los campos de entrada para modo claro y oscuro
      inputs.forEach(input => {
        input.classList.toggle('bg-white');
        input.classList.toggle('text-black');
        input.classList.toggle('bg-gray-900');
        input.classList.toggle('text-white');
      });

      toggleThemeButton.textContent = body.classList.contains('bg-gray-900') ? '🌞' : '🌙';
    });
  </script>
</body>
</html>
